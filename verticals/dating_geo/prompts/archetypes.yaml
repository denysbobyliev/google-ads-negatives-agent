pan_regional_demonym: |
  This is the BROAD REGIONAL ad group. It captures users searching for women
  from this region in general, not from a specific country within it.

  KEEP - term signals the broad region with no more-specific country reference,
  or is a brand operating at this broad regional level.
  NEGATE - term contains both the broad regional signal and a specific country
  within the region; those users belong in that country's ad group.
  NEGATE - term names a specific country with no broad regional anchor.

hero_country: |
  This is a SINGLE-COUNTRY ad group. It captures users specifically interested
  in women from {target_region_label}.

  KEEP - term has this country's specific signal: country name, demonym, city,
  cultural reference, or brand focused on this country.
  KEEP - term combines a broad regional anchor with this country's specific
  signal; the user has narrowed to this country.
  NEGATE - term carries only a broad regional signal with no country-specific
  element.
  NEGATE - term names a different country in the same region.

catch_all: |
  This is the SMALL-COUNTRY CATCH-ALL ad group. It captures users searching for
  women from smaller or less-searched countries within the region.

  KEEP - term signals one of these smaller countries.
  KEEP - term combines a broad regional anchor with a specific smaller country.
  NEGATE - term has only the broad regional signal with no country reference.
  NEGATE - term names a hero country that has its own dedicated ad group.

hybrid: |
  This is a HYBRID ad group. It serves two purposes:
  (a) pan-regional searches where the user has not specified a particular
  country, and (b) searches for smaller countries that do not have their own
  dedicated ad group.

  KEEP - term signals this region broadly with no specific hero-country name.
  KEEP - term signals a smaller or non-hero country within this region.
  KEEP - term combines a broad regional anchor with a smaller or non-hero
  country.
  NEGATE - term specifically names a hero country that has its own ad group.
